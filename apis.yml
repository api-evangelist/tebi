aid: tebi
name: Tebi
description: >-
  Tebi is a hospitality management platform that unifies point-of-sale, payments,
  and back-office operations for restaurants, bars, cafes, bakeries, quick-service
  venues, and events. The system connects front-of-house service to back-office
  administration in a single product spanning Point of Sale, Kitchen Display System,
  Reservations, integrated card Payments (with invoicing and split-bill), QR ordering,
  inventory management, CRM, recipe management, and AI-driven insights. Tebi is priced
  on a revenue-based subscription (the first EUR 10k of monthly revenue is free, each
  additional EUR 10k costs EUR 20/month) with no long-term contracts, and it bundles
  its own payment processing with transparent per-transaction fees. The company is
  backed by Index Ventures. Tebi does not currently publish a public developer API,
  OpenAPI specification, SDKs, or a developer portal; this profile captures its
  production identity, help center, changelog, status page, and security posture as
  surfaced by the API Evangelist enrichment pipeline.
